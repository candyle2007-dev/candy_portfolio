<style>
:root {
  --bg: #090a0c;
  --bg-elevated: #101216;
  --bg-secondary: #16191e;
  --text: #f2f3f5;
  --text-secondary: #a2a8b0;
  --text-muted: #6f7680;
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.18);
  --accent: #5ea2ff;
  --accent-secondary: #77e0d1;
  --success: #63d69b;
  --danger: #f87171;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-heading: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, pre { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
::selection { background: rgba(94, 162, 255, 0.3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* ---------- Layout & type ---------- */
.container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
@media (min-width: 640px) { .container { padding: 0 2rem; } }
@media (min-width: 1024px) { .container { padding: 0 3rem; } }

.section { padding: 6rem 0; scroll-margin-top: 4rem; }
@media (min-width: 768px) { .section { padding: 8rem 0; } }
.section--tinted { background: rgba(16, 18, 22, 0.3); }

.display-lg, .display-md, .display-sm { font-family: var(--font-heading); font-weight: 700; color: var(--text); }
.display-lg { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
.display-md { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 1rem; }
.display-sm { font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 0.75rem; }

.section-header { margin-bottom: 4rem; }
.section-label {
  font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--text-muted); margin-bottom: 1rem;
}
.section-description { color: var(--text-secondary); font-size: 1.125rem; line-height: 1.625; max-width: 42rem; }
.mini-heading {
  font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.15em; color: var(--text-muted); margin-bottom: 1rem; font-weight: 400;
}

/* ---------- Reusable bits ---------- */
.tag {
  display: inline-block; padding: 0.25rem 0.625rem; font-family: var(--font-mono); font-size: 0.75rem;
  font-weight: 500; background: var(--bg-elevated); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 0.375rem;
}
.tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.tags:last-child { margin-bottom: 0; }

.bullets { display: grid; gap: 0.5rem; margin-bottom: 1rem; }
.bullets:last-child { margin-bottom: 0; }
.bullet { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: var(--text-secondary); }
.dot { color: var(--accent); font-size: 6px; margin-top: 0.45rem; flex-shrink: 0; }
.dot--teal { color: var(--accent-secondary); }

.btn {
  display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem;
  border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; transition: background-color 0.2s, border-color 0.2s;
}
.btn--primary { background: var(--accent); color: var(--bg); }
.btn--primary:hover { background: rgba(94, 162, 255, 0.9); }
.btn--ghost { background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text); font-weight: 500; }
.btn--ghost:hover { background: var(--bg-secondary); }

.text-link { display: inline-flex; align-items: center; gap: 0.375rem; color: var(--accent); font-size: 0.875rem; font-weight: 500; transition: opacity 0.2s; }
.text-link:hover { opacity: 0.8; }
.icon-link { color: var(--text-muted); display: inline-flex; transition: color 0.2s; }
.icon-link:hover { color: var(--text); }

.card { border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; background: var(--bg-elevated); }
.card--hover { background: var(--bg); transition: border-color 0.2s; }
.card--hover:hover { border-color: var(--border-strong); }
.card h4, .card__title { font-family: var(--font-heading); font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; }
.card__title { margin-bottom: 1rem; }
.card__sub { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
.card__date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

/* ---------- Animations ---------- */
.reveal {
  opacity: 0; transform: translateY(var(--reveal-y, 30px));
  transition: opacity 0.6s ease, transform 0.6s ease; transition-delay: var(--reveal-delay, 0s);
}
.reveal.is-visible { opacity: 1; transform: none; }
.intro { opacity: 0; transform: translateY(20px); animation: intro 0.5s ease forwards; animation-delay: var(--d, 0s); }
@keyframes intro { to { opacity: 1; transform: none; } }

.pulsing-node {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent-secondary); flex-shrink: 0;
  animation: pulse-glow 2.5s infinite ease-in-out;
}
@keyframes pulse-glow {
  0%, 100% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 0 rgba(119, 224, 209, 0.3); }
  50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 8px 1.5px rgba(119, 224, 209, 0.7); }
}
.high-tech-border { position: relative; }
.high-tech-border::before, .high-tech-border::after {
  content: ''; position: absolute; left: 0; right: 0; height: 1px; background-size: 200% 100%;
  animation: scanline 6s infinite linear;
}
.high-tech-border::before { top: 0; background-image: linear-gradient(90deg, transparent, rgba(94, 162, 255, 0.4), rgba(119, 224, 209, 0.4), transparent); }
.high-tech-border::after { bottom: 0; background-image: linear-gradient(90deg, transparent, rgba(119, 224, 209, 0.4), rgba(94, 162, 255, 0.4), transparent); animation-direction: reverse; }
@keyframes scanline { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal, .intro { opacity: 1; transform: none; transition: none; animation: none; }
  .pulsing-node, .high-tech-border::before, .high-tech-border::after { animation: none; }
}

/* ---------- Navbar ---------- */
.navbar { position: fixed; inset: 0 0 auto 0; z-index: 50; transition: background-color 0.3s, border-color 0.3s; border-bottom: 1px solid transparent; }
.navbar--solid { background: rgba(9, 10, 12, 0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom-color: var(--border); }
.navbar__inner { display: flex; align-items: center; justify-content: space-between; height: 4rem; }
.navbar__brand { font-family: var(--font-heading); font-size: 1.125rem; font-weight: 700; transition: color 0.2s; }
.navbar__brand:hover { color: var(--accent); }
.navbar__links, .navbar__actions { display: none; align-items: center; }
.navbar__links { gap: 2rem; }
.navbar__actions { gap: 1rem; }
.navbar__link { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); transition: color 0.2s; }
.navbar__link:hover, .navbar__link.is-active { color: var(--text); }
.navbar__resume { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); transition: color 0.2s; }
.navbar__resume:hover { color: var(--accent); }
.navbar__divider { width: 1px; height: 1rem; background: var(--border); }
.navbar__toggle { padding: 0.5rem; color: var(--text-secondary); display: inline-flex; }
@media (min-width: 768px) {
  .navbar__links, .navbar__actions { display: flex; }
  .navbar__toggle { display: none; }
}
.mobile-menu {
  position: fixed; inset: 0; z-index: 40; background: rgba(9, 10, 12, 0.98); backdrop-filter: blur(24px);
  padding: 5rem 2rem 2rem; display: flex; flex-direction: column;
}
.mobile-menu__links { display: flex; flex-direction: column; }
.mobile-menu__link {
  text-align: left; font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700;
  padding: 0.75rem 0; border-bottom: 1px solid var(--border); transition: color 0.2s;
}
.mobile-menu__link:hover { color: var(--accent); }
.mobile-menu__resume { margin-top: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; color: var(--accent); font-weight: 500; }

/* ---------- Hero ---------- */
.hero { position: relative; min-height: 90vh; display: flex; align-items: center; overflow: hidden; }
.hero__canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hero__glow {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(600px circle at 80% 30%, rgba(94, 162, 255, 0.12), transparent 60%),
    radial-gradient(500px circle at 15% 85%, rgba(119, 224, 209, 0.07), transparent 60%);
}
.hero__grid {
  position: absolute; top: 0; right: 0; width: 50%; height: 100%; opacity: 0.03; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
  background-size: 60px 60px;
}
.hero__inner { position: relative; z-index: 1; width: 100%; padding-top: 8rem; padding-bottom: 8rem; }
@media (min-width: 768px) { .hero__inner { padding-top: 10rem; padding-bottom: 10rem; } }
.hero__content { max-width: 48rem; }
.hero__eyebrow { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--accent); margin-bottom: 1.5rem; }
.hero__sub { font-size: 1.125rem; color: var(--text-secondary); line-height: 1.625; max-width: 42rem; margin-bottom: 2.5rem; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 3rem; }
.hero__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem; color: var(--text-muted); font-size: 0.875rem; }
.hero__meta a, .hero__meta span { display: inline-flex; align-items: center; gap: 0.5rem; }
.hero__meta a { transition: color 0.2s; }
.hero__meta a:hover { color: var(--text); }

.stream { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: rgba(16, 18, 22, 0.4); backdrop-filter: blur(12px); }
.stream__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1rem 2rem; padding-top: 1.25rem; padding-bottom: 1.25rem; }
.stream__label { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); }
.stream__item { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); transition: color 0.3s; cursor: default; }
.stream__item:hover { color: var(--accent); }

/* ---------- Work ---------- */
.projects { display: grid; gap: 6rem; }
@media (min-width: 1024px) { .projects { gap: 8rem; } }
.project { display: grid; gap: 2rem; align-items: center; }
@media (min-width: 1024px) {
  .project { grid-template-columns: 1fr 1fr; gap: 4rem; }
  .project--reversed .project__visual { order: 2; }
}
.project__visual {
  position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(94, 162, 255, 0.18), transparent 55%),
    radial-gradient(circle at 85% 90%, rgba(119, 224, 209, 0.14), transparent 50%),
    var(--bg-elevated);
  display: flex; align-items: center; justify-content: center; padding: 8%;
}
.project__window {
  width: 100%; background: rgba(9, 10, 12, 0.85); border: 1px solid var(--border-strong); border-radius: 0.5rem;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); transition: transform 0.5s ease;
}
.project:hover .project__window { transform: scale(1.03); }
.project__window-bar { display: flex; align-items: center; gap: 0.375rem; padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--border); }
.project__window-bar span { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.project__window-bar p { margin-left: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
.project__code { padding: 1rem; font-family: var(--font-mono); font-size: clamp(0.65rem, 1.4vw, 0.85rem); color: var(--text-secondary); display: grid; gap: 0.35rem; overflow: hidden; white-space: pre; }
.project__code code:first-child { color: var(--accent); }
.project__ln { color: var(--text-muted); opacity: 0.5; margin-right: 1rem; }
.project__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-bottom: 1rem; font-family: var(--font-mono); font-size: 0.75rem; }
.project__category { text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.project__year { color: var(--text-muted); }
.project__sample { color: #fde68a; border: 1px solid rgba(250, 204, 21, 0.4); border-radius: 999px; padding: 0.125rem 0.5rem; font-size: 0.65rem; }
.project__summary { color: var(--text-secondary); line-height: 1.625; max-width: 32rem; margin-bottom: 1rem; }
.project__role { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem; }
.work__cta { margin-top: 6rem; display: flex; justify-content: center; }
.glow-btn {
  display: inline-flex; align-items: center; gap: 1rem; padding: 1.25rem 2rem; border-radius: 0.5rem;
  border: 1px solid rgba(94, 162, 255, 0.25); background: rgba(94, 162, 255, 0.05); color: var(--accent);
  font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; text-align: center;
  transition: all 0.3s;
}
.glow-btn:hover { background: rgba(94, 162, 255, 0.15); border-color: var(--accent); box-shadow: 0 0 25px rgba(94, 162, 255, 0.3); }
@media (min-width: 640px) { .glow-btn { padding: 1.25rem 3rem; } }

/* ---------- Experience ---------- */
.timeline { margin-bottom: 5rem; }
.timeline__entry { display: grid; gap: 1rem; padding: 2rem 0; border-bottom: 1px solid var(--border); }
.timeline__entry:last-child { border-bottom: 0; }
@media (min-width: 768px) { .timeline__entry { grid-template-columns: 200px 1fr; gap: 2rem; } }
.timeline__when { display: flex; flex-direction: column; font-family: var(--font-mono); font-size: 0.875rem; color: var(--text-muted); }
.timeline__where { font-size: 0.75rem; opacity: 0.6; margin-top: 0.25rem; }
.timeline__role { font-family: var(--font-heading); font-size: 1.125rem; font-weight: 700; margin-bottom: 0.25rem; transition: color 0.2s; }
.timeline__entry:hover .timeline__role { color: var(--accent); }
.timeline__company { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
.timeline__summary { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.625; max-width: 42rem; margin-bottom: 1rem; }
.education__heading { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; color: var(--text-muted); }
.education__heading h3 { font-family: var(--font-heading); font-size: 1.125rem; font-weight: 700; color: var(--text); }
.education { display: grid; gap: 1rem; }
@media (min-width: 768px) { .education { grid-template-columns: repeat(3, 1fr); } }

/* ---------- Skills ---------- */
.skills { display: grid; gap: 2rem; }
@media (min-width: 640px) { .skills { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .skills { grid-template-columns: repeat(4, 1fr); } }

/* ---------- About & Contact split ---------- */
.split { display: grid; gap: 3rem; }
@media (min-width: 1024px) {
  .split { grid-template-columns: repeat(5, 1fr); gap: 4rem; }
  .split__main { grid-column: span 3; }
  .split__side { grid-column: span 2; }
}
.split__side { display: grid; gap: 2rem; align-content: start; }
.prose { color: var(--text-secondary); line-height: 1.85; max-width: 42rem; margin-bottom: 1.5rem; }
.about__degree { font-size: 0.875rem; font-weight: 500; }
.about__school { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.125rem; }
.about__date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); opacity: 0.6; margin-top: 0.125rem; }

.form { display: grid; gap: 1.5rem; }
.form label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
.req { color: var(--accent); }
.optional { color: var(--text-muted); font-size: 0.75rem; margin-left: 0.5rem; font-weight: 400; }
.input {
  width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem;
  color: var(--text); font: inherit; font-size: 0.875rem; transition: border-color 0.2s;
}
.input::placeholder { color: rgba(111, 118, 128, 0.6); }
.input:focus { outline: none; border-color: var(--accent); }
.input--error { border-color: rgba(239, 68, 68, 0.6); }
textarea.input { resize: vertical; }
.error { margin-top: 0.375rem; font-size: 0.75rem; color: var(--danger); }
.form .btn { justify-self: start; }
.success { border: 1px solid rgba(99, 214, 155, 0.3); background: rgba(99, 214, 155, 0.05); border-radius: 0.5rem; padding: 2rem; text-align: center; color: var(--success); }
.success h3 { font-family: var(--font-heading); font-size: 1.125rem; color: var(--text); margin: 1rem 0 0.5rem; }
.success p { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem; }
.contact__direct { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem; word-break: break-all; transition: color 0.2s; }
a.contact__direct:hover { color: var(--accent); }
.contact__note { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.625; }

/* ---------- Footer ---------- */
.footer { border-top: 1px solid var(--border); padding: 4rem 0; }
.footer__grid { display: grid; gap: 3rem; }
@media (min-width: 768px) { .footer__grid { grid-template-columns: repeat(3, 1fr); } }
.footer__tagline { margin-top: 0.75rem; font-size: 0.875rem; color: var(--text-muted); line-height: 1.625; max-width: 20rem; }
.footer__list { display: grid; gap: 0.5rem; }
.footer__list a { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-secondary); transition: color 0.2s; }
.footer__list a:hover { color: var(--text); }
.footer__bottom {
  margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1rem;
  font-size: 0.75rem; color: var(--text-muted);
}
@media (min-width: 640px) { .footer__bottom { flex-direction: row; } }

</style>

// ---- hooks.js ----

function useActiveSection(ids) {
  const [active, setActive] = useState('');
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        for (const entry of entries) if (entry.isIntersecting) setActive(entry.target.id);
      },
      { rootMargin: '-80px 0px -60% 0px', threshold: 0 }
    );
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    }
    return () => observer.disconnect();
  }, [ids]);
  return active;
}

function useInView(margin = '-80px') {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          observer.disconnect();
        }
      },
      { rootMargin: `0px 0px ${margin} 0px` }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, [margin]);
  return [ref, inView];
}

// Drifting particle network — a lightweight 2D take on the reference site's WebGL background.
function HeroCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mouse = { x: -9999, y: -9999 };
    let width = 0;
    let height = 0;
    let particles = [];
    let frame = 0;

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(Math.min(110, (width * height) / 11000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.4 + 0.4,
        teal: Math.random() < 0.35,
      }));
    };

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      const linkDist = 130;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!reduced) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const d = Math.hypot(dx, dy);
          if (d < 120 && d > 0) {
            p.x += (dx / d) * 0.6;
            p.y += (dy / d) * 0.6;
          }
        }
        for (let j = i + 1; j < particles.length; j++) {
          const q = particles[j];
          const dist = Math.hypot(p.x - q.x, p.y - q.y);
          if (dist < linkDist) {
            ctx.strokeStyle = `rgba(94, 162, 255, ${0.16 * (1 - dist / linkDist)})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        ctx.fillStyle = p.teal ? 'rgba(119, 224, 209, 0.8)' : 'rgba(94, 162, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduced) frame = requestAnimationFrame(draw);
    };

    const onMove = (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    };

    resize();
    draw();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', onMove);
    return () => {
      cancelAnimationFrame(frame);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="hero__canvas" aria-hidden="true" />;
}

              <h3 className="mini-heading">Currently Learning</h3>
              <ul className="bullets">
                {learning.map((p) => <Bullet key={p}>{p}</Bullet>)}
              </ul>
            </div>
            <div>
              <h3 className="mini-heading">Education</h3>
              {education.slice(0, 1).map((ed) => (
                <div key={ed.degree}>
                  <p className="about__degree">{ed.degree}</p>
                  <p className="about__school">{ed.institution}</p>
                  <p className="about__date">{ed.date}</p>
                </div>
              ))}
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

const emptyForm = { name: '', email: '', company: '', reason: '', message: '' };
const reasons = ['Internship opportunity', 'Full-time role', 'IT support enquiry', 'General'];

function Contact() {
  const [form, setForm] = useState(emptyForm);
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const onChange = (e) => {
    setForm({ ...form, [e.target.name]: e.target.value });
    if (errors[e.target.name]) setErrors({ ...errors, [e.target.name]: undefined });
  };

  const validate = () => {
    const next = {};
    if (!form.name.trim()) next.name = 'Please enter your name.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) next.email = 'Please enter a valid email address.';
    if (form.message.trim().length < 10) next.message = 'Please write at least 10 characters.';
    setErrors(next);
    return Object.keys(next).length === 0;
  };

  // No backend: compose the message in the visitor's email app.
  const onSubmit = (e) => {
    e.preventDefault();
    if (!validate()) return;
    const subject = `[${form.reason || 'General'}] Message from ${form.name}`;
    const body = `${form.message}\n\n— ${form.name}\n${form.email}${form.company ? `\n${form.company}` : ''}`;
    window.location.href = `mailto:${profile.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    setSent(true);
    setForm(emptyForm);
  };

  const field = (name) => `input ${errors[name] ? 'input--error' : ''}`;

  return (
    <section id="contact" className="section section--tinted">
      <div className="container">
        <SectionHeader
          label="Contact"
          title="Let's work together."
          description="Whether it's an internship, an IT support role or just a question, send me a message with a little context and I'll get back to you."
        />
        <div className="split">
          <Reveal className="split__main">
            {sent ? (
              <div className="success">
                <Icon name="check" size={40} />
                <h3>Your email app should now be open.</h3>
                <p>Just hit send there. Thanks for reaching out!</p>
                <button onClick={() => setSent(false)} className="text-link">Send another message</button>
              </div>
            ) : (
              <form onSubmit={onSubmit} className="form" noValidate>
                <div>
                  <label htmlFor="contact-name">Name <span className="req">*</span></label>
                  <input id="contact-name" name="name" value={form.name} onChange={onChange} placeholder="Your name" className={field('name')} />
                  {errors.name && <p className="error">{errors.name}</p>}
                </div>
                <div>
                  <label htmlFor="contact-email">Email <span className="req">*</span></label>
                  <input id="contact-email" type="email" name="email" value={form.email} onChange={onChange} placeholder="you@company.com" className={field('email')} />
                  {errors.email && <p className="error">{errors.email}</p>}
                </div>
                <div>
                  <label htmlFor="contact-company">Company or organisation <span className="optional">Optional</span></label>
                  <input id="contact-company" name="company" value={form.company} onChange={onChange} placeholder="Your company" className="input" />
                </div>
                <div>
                  <label htmlFor="contact-reason">Reason for contacting</label>
                  <select id="contact-reason" name="reason" value={form.reason} onChange={onChange} className="input">
                    <option value="">Select a reason</option>
                    {reasons.map((r) => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div>
                  <label htmlFor="contact-message">Message <span className="req">*</span></label>
                  <textarea id="contact-message" name="message" rows={5} value={form.message} onChange={onChange} placeholder="Tell me a little about the role or what you need help with…" className={field('message')} />
                  {errors.message && <p className="error">{errors.message}</p>}
                </div>
                <button type="submit" className="btn btn--primary">
                  Send Message <Icon name="send" />
                </button>
              </form>
            )}
          </Reveal>

          <Reveal delay={0.1} className="split__side">
            <div>
              <h3 className="mini-heading">Direct</h3>
              <a href={`mailto:${profile.email}`} className="contact__direct">
                <Icon name="mail" /> {profile.email}
              </a>
              <p className="contact__direct">
                <Icon name="mapPin" /> {profile.location}
              </p>
            </div>
            <div>
              <h3 className="mini-heading">Availability</h3>
              <p className="contact__note">
                Currently interning as a Deskside Engineer until December 2026 while studying at UOW. Open to IT support and tech internship opportunities.
              </p>
            </div>
            <div>
              <h3 className="mini-heading">Résumé</h3>
              <a href={profile.resumeUrl} target="_blank" rel="noopener noreferrer" className="text-link">
                <Icon name="file" /> Download PDF
              </a>
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}
